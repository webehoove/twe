  <style>
    /* Настройка прозрачности и плавности */
    .first-logo, .second-logo {
      transition: opacity 0s ease-in-out;
    }

    /* По умолчанию первый виден, второй скрыт */
    .first-logo { opacity: 1; }
    .second-logo { opacity: 0; }

    /* При наведении мышкой меняем их местами */
    svg:hover .first-logo { opacity: 0; }
    svg:hover .second-logo { opacity: 1; }
	
    .st0{fill:#FFFFFF;stroke:#460FA0;stroke-width:72;stroke-miterlimit:10;}
    .st1{fill:#FF3C00;}
    .st2{fill:#460FA0;}
  </style>

